<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortly</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['DM Sans', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulse-dot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
      .fade-up { animation: fadeUp 0.4s ease forwards; }
      .fade-up-delay { animation: fadeUp 0.4s ease 0.1s forwards; opacity: 0; }
      .copy-flash { animation: fadeUp 0.2s ease forwards; }
      body { box-sizing: border-box; }
    </style>
  </head>
  <body class="h-full bg-gray-50 font-sans text-gray-800 overflow-auto">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
